name: Build APK Android

on:
  workflow_dispatch:        # bouton « Run workflow » dans l'onglet Actions
  push:
    branches: [main]
    paths: ["web/**", "android/**", ".github/workflows/build-apk.yml"]
    tags: ["v*"]            # un tag v1.0 publie aussi une Release avec l'APK

permissions:
  contents: write           # nécessaire pour créer la Release

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Installer Capacitor
        working-directory: android
        run: npm install

      - name: Créer le projet Android
        working-directory: android
        run: npx cap add android

      - name: Autoriser la caméra
        working-directory: android
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application|' "$MANIFEST"
          grep -n "CAMERA" "$MANIFEST"

      - name: Synchroniser le contenu web
        working-directory: android
        run: npx cap sync android

      - name: Compiler l'APK (debug, signé automatiquement)
        working-directory: android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Vérifier le contenu de l'APK
        run: |
          APK=android/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$APK" | grep -E "assets/public/(index.html|js/app.bundle.js|sw.js)" | tee /tmp/assets.txt
          test "$(wc -l < /tmp/assets.txt)" -ge 3 || (echo "Fichiers web manquants dans l'APK" && exit 1)
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt | tail -1)
          "$AAPT" dump permissions "$APK" | grep -E "CAMERA|INTERNET" || true

      - name: Renommer l'APK
        run: cp android/android/app/build/outputs/apk/debug/app-debug.apk TennisCoachIA.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TennisCoachIA-apk
          path: TennisCoachIA.apk

      - name: Publier une Release (si tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TennisCoachIA.apk
